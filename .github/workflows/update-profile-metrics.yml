name: Update profile metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 20 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refresh metrics
        run: python scripts/update_profile_metrics.py

      - name: Commit updated metrics
        run: |
          if git diff --quiet -- _data/profile_metrics.yml; then
            echo "No metric changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/profile_metrics.yml
          git commit -m "Update profile metrics"
          git push
